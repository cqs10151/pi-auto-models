name: Publish to npm

# Publishes when you push a version tag (e.g. v0.1.3).
# Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN needed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the GitHub Release
  id-token: write # required for OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # Trusted Publishing needs npm >= 11.5.1
      - run: npm publish
      - name: Create GitHub Release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
